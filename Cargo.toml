[package]
name = "esp-p4-mini-bootloader"
version = "0.2.0"
edition = "2021"
description = "All-Rust 1st-stage bootloader for ESP32-P4. Replaces IDF v5.3 bootloader.bin (which has hard architectural assumptions about app segment layout that no_std Rust apps don't satisfy). ROM loads us from flash@0x2000; we init the chip, read the partition table, locate the factory app, verify its appended SHA256, load segments via cache, surface any pending crash dump / boot-history / bootstat record, drive A/B-slot selection with rollback, and jump to the app entry."
license = "MIT OR Apache-2.0"
repository = "https://github.com/babasha/esp-p4-mini-bootloader"
readme = "README.md"
keywords = ["esp32p4", "bootloader", "no-std", "embedded", "espressif"]
categories = ["embedded", "no-std", "hardware-support"]

[[bin]]
name = "mini-bootloader"
path = "src/main.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
bootloader       = { package = "esp-p4-bootloader",    version = "0.2" }
psram            = { package = "esp-p4-psram",         version = "0.2" }
p4_crashdump     = { package = "esp-p4-crashdump",     version = "0.1" }
p4_boot_history  = { package = "esp-p4-boot-history",  version = "0.1" }
p4_bootstat      = { package = "esp-p4-bootstat",      version = "0.1" }
p4_ota           = { package = "esp-p4-ota",           version = "0.1" }
riscv-rt         = { version = "0.16", features = ["memory", "device"] }
sha2             = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
